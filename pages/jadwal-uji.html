<div class="space-y-6 animate-fade-in-up">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 border-b border-slate-200/80 pb-5">
        <div>
            <div class="flex items-center gap-2 text-sm text-brand-orange font-semibold mb-1">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Manajemen Jadwal</span>
            </div>
            <h3 class="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">Jadwal Ujian & Asesor</h3>
            <p class="text-sm text-slate-500 mt-1">Kelompokkan jadwal, tetapkan Asesor, dan cetak Daftar Hadir asesi otomatis.</p>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <button id="btnRefreshJadwal" onclick="fetchAndGroupJadwal()" class="group inline-flex items-center gap-2 px-5 py-2.5 bg-slate-900 hover:bg-brand-orange text-white text-sm font-bold rounded-xl transition-all shadow-sm">
                <i class="fa-solid fa-rotate-right group-hover:rotate-180 transition-transform duration-500"></i>
                <span>Sinkronisasi Data</span>
            </button>
        </div>
    </div>

    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col lg:flex-row gap-4 items-center justify-between">
        <div class="relative w-full lg:flex-1 max-w-2xl">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input 
                type="text" id="searchJadwal" placeholder="Cari lokasi TUK atau nama asesor..." 
                class="w-full pl-11 pr-4 py-2.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-orange focus:bg-white transition-all"
            >
        </div>
        <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
            <div class="w-full sm:w-48 shrink-0 relative">
                <select id="filterSkemaJadwal" class="w-full pl-4 pr-10 py-2.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl appearance-none focus:outline-none focus:border-brand-orange focus:bg-white transition-all cursor-pointer">
                    <option value="">Semua Skema</option>
                    <option value="AUDITOR">Auditor</option>
                    <option value="PCUA">PCUA</option>
                    <option value="PCUE">PCUE</option>
                    <option value="PCUL">PCUL</option>
                    <option value="POIPPU">POIPPU</option>
                    <option value="POPAL">POPAL</option>
                    <option value="PPPA">PPPA</option>
                    <option value="PPPU">PPPU</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
            </div>
            <div class="w-full sm:w-48 shrink-0 relative">
                <input 
                    type="date" id="filterTanggalJadwal"
                    class="w-full px-4 py-2.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-orange focus:bg-white transition-all cursor-pointer text-slate-500"
                >
            </div>
        </div>
    </div>

    <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[900px]">
                <thead>
                    <tr class="bg-slate-50/80 border-b border-slate-200/80 text-[11px] font-bold uppercase tracking-widest text-slate-500">
                        <th class="py-4 px-6">Tanggal & TUK</th>
                        <th class="py-4 px-6">Skema Uji</th>
                        <th class="py-4 px-6 text-center">Total Asesi</th>
                        <th class="py-4 px-6 min-w-[300px]">Penugasan Asesor</th>
                        <th class="py-4 px-6 text-center">Unduh PDF</th>
                    </tr>
                </thead>
                <tbody id="tableBodyJadwal" class="divide-y divide-slate-100 text-sm">
                    <!-- Data Jadwal Dirender di Sini -->
                </tbody>
            </table>
        </div>
        
        <div id="emptyJadwalState" class="hidden flex-col items-center justify-center py-20 text-center px-4">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-5 border border-slate-100 shadow-sm">
                <i class="fa-regular fa-calendar-xmark text-3xl text-slate-400"></i>
            </div>
            <h4 class="text-base font-semibold text-slate-800">Tidak ada jadwal ditemukan</h4>
            <p class="text-sm text-slate-500 mt-1">Sistem belum mendeteksi asesi yang mendaftar atau filter tidak cocok.</p>
        </div>
    </div>
</div>

<div id="toastJadwal" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 z-[60] flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border pointer-events-none bg-white">
    <div id="toastIconJadwal" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"></div>
    <p id="toastMessageJadwal" class="text-sm font-medium text-slate-700"></p>
</div>

<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" onload="if(typeof fetchAndGroupJadwal === 'function') fetchAndGroupJadwal()" style="display: none;">

<script>
    // PERBAIKAN: Gunakan var agar tidak bentrok dengan router SPA
    var SUPABASE_URL = 'https://edqjvmlbgmrqrrsuykwu.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkcWp2bWxiZ21ycXJyc3V5a3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MTgxNzYsImV4cCI6MjA5NDk5NDE3Nn0.OqMcLJgTLopmRbWsd3FWsP49ZIeDMQaqge3z2cghzpM';
    
    var GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxWdiFQOWmHMSJqgMb5lNBf5scB8gple8E95OxzYShJeevJdsGt4N4KQI8QsPA6KDOsIA/exec'; 

    var schemaTables = [
        'pendaftaran_auditor', 'pendaftaran_pcua', 'pendaftaran_pcue', 
        'pendaftaran_pcul', 'pendaftaran_poippu', 'pendaftaran_popal', 
        'pendaftaran_pppa', 'pendaftaran_pppu'
    ];

    var sbClient = window.sbClient || null;
    if (typeof supabase !== 'undefined' && !sbClient) {
        sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.sbClient = sbClient;
    }

    var allJadwalData = [];

    async function fetchAndGroupJadwal() {
        const tableBody = document.getElementById('tableBodyJadwal');
        if (!tableBody) return; // Mencegah error jika DOM belum siap

        if (!sbClient) {
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-16 text-rose-500 font-medium">Supabase belum terinisialisasi.</td></tr>`;
            return;
        }

        tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-16"><i class="fa-solid fa-circle-notch fa-spin text-brand-orange text-3xl mb-4"></i><p class="text-sm text-slate-500 font-medium mt-2">Menyinkronkan data Asesi & Asesor...</p></td></tr>`;

        try {
            // Fetch dari 8 tabel Supabase secara paralel
            const fetchPromises = schemaTables.map(table => sbClient.from(table).select('nama, instansi, whatsapp, tanggal, tuk, schema'));
            const results = await Promise.all(fetchPromises);
            
            // Fetch data Asesor dari Google Sheets (GAS) dengan Timeout
            let dataAsesorSheet = [];
            try {
                if(GAS_WEBAPP_URL && GAS_WEBAPP_URL.includes('script.google.com')) {
                    // Batasi fetch Google Sheet maks 10 detik agar tidak hang selamanya
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000); 

                    const resGas = await fetch(GAS_WEBAPP_URL, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    if(resGas.ok) {
                        const jsonGas = await resGas.json();
                        // Pastikan response Google adalah array (menghindari error .find())
                        if(Array.isArray(jsonGas)) {
                            dataAsesorSheet = jsonGas;
                        }
                    }
                }
            } catch(e) { 
                console.warn("GAS timeout atau diblokir:", e); 
                // Sistem tidak akan berhenti meskipun Google Apps Script sedang error/diblokir
            }

            let combinedRawData = [];
            results.forEach((result, index) => {
                if (!result.error && result.data) {
                    const mapped = result.data.map(item => ({
                        ...item, skema_real: (item.schema || schemaTables[index].replace('pendaftaran_', '')).toUpperCase()
                    }));
                    combinedRawData = [...combinedRawData, ...mapped];
                }
            });

            // Grouping berdasarkan Tanggal + Skema + TUK
            const grouped = {};
            combinedRawData.forEach(item => {
                if (!item.tanggal || !item.tuk || item.tanggal === 'NULL') return; 
                
                const groupKey = `${item.tanggal}_${item.skema_real}_${item.tuk}`;
                
                if (!grouped[groupKey]) {
                    let savedAsesor = '';
                    if (dataAsesorSheet.length > 0) {
                        const match = dataAsesorSheet.find(d => {
                            // Cek keamanan variabel agar tidak error null
                            if(!d.tanggal || !d.skema || !d.tuk) return false;
                            return (new Date(d.tanggal).toDateString() === new Date(item.tanggal).toDateString()) && 
                                   (d.skema === item.skema_real) && 
                                   (d.tuk === item.tuk);
                        });
                        if (match && match.asesor) savedAsesor = match.asesor;
                    }
                    
                    grouped[groupKey] = {
                        id: groupKey,
                        tanggal: item.tanggal,
                        skema: item.skema_real,
                        tuk: item.tuk,
                        asesor: savedAsesor, 
                        asesiList: []
                    };
                }
                
                grouped[groupKey].asesiList.push({
                    nama: item.nama || 'Tanpa Nama', instansi: item.instansi || '-', whatsapp: item.whatsapp || '-'
                });
            });

            // Urutkan berdasarkan tanggal terdekat
            allJadwalData = Object.values(grouped).sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));
            applyFiltersJadwal();

        } catch (error) {
            console.error(error);
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-rose-500 font-medium">Gagal memuat jadwal (${error.message}). Pastikan koneksi internet stabil.</td></tr>`;
        }
    }

    function renderJadwalTable(data) {
        const tableBody = document.getElementById('tableBodyJadwal');
        const emptyState = document.getElementById('emptyJadwalState');
        if (!tableBody) return;
        
        tableBody.innerHTML = '';

        if (data.length === 0) {
            emptyState.classList.remove('hidden'); emptyState.classList.add('flex');
            return;
        } else {
            emptyState.classList.add('hidden'); emptyState.classList.remove('flex');
        }

        data.forEach((jadwal, index) => {
            const dateObj = new Date(jadwal.tanggal);
            const dateStr = dateObj.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            const row = document.createElement('tr');
            row.className = 'hover:bg-slate-50 transition-colors group border-b border-slate-50';
            
            row.innerHTML = `
                <td class="py-4 px-6">
                    <div class="font-bold text-slate-900">${dateStr}</div>
                    <div class="text-xs font-medium text-slate-500 flex items-center gap-1.5 mt-1">
                        <i class="fa-solid fa-location-dot text-brand-orange"></i> ${jadwal.tuk || '-'}
                    </div>
                </td>
                <td class="py-4 px-6">
                    <span class="inline-flex px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-200/60 shadow-xs">${jadwal.skema}</span>
                </td>
                <td class="py-4 px-6 text-center">
                    <div class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold text-xs border border-slate-200">${jadwal.asesiList.length}</div>
                </td>
                <td class="py-4 px-6">
                    <div class="flex items-center gap-2">
                        <input 
                            type="text" id="inputAsesor_${index}" value="${jadwal.asesor || ''}" placeholder="Ketik nama asesor..." 
                            class="w-full px-3 py-2 text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-brand-orange focus:bg-white transition-all font-semibold"
                        >
                        <button 
                            onclick="simpanAsesor(event, ${index})" title="Simpan ke Sheets"
                            class="shrink-0 px-3 py-2 bg-slate-900 hover:bg-brand-orange text-white text-xs font-bold rounded-lg transition-colors flex items-center gap-2 shadow-sm"
                        >
                            <i class="fa-solid fa-floppy-disk"></i> Simpan
                        </button>
                    </div>
                </td>
                <td class="py-4 px-6 text-center">
                    <button 
                        onclick="generateAbsensi(${index})" 
                        class="inline-flex items-center justify-center px-4 py-2 bg-white border border-slate-200 hover:border-brand-orange text-slate-600 hover:text-brand-orange hover:bg-orange-50 rounded-xl transition-all shadow-sm font-bold text-xs gap-2" title="Cetak Daftar Hadir"
                    >
                        <i class="fa-solid fa-print"></i> Cetak
                    </button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function applyFiltersJadwal() {
        const keywordInput = document.getElementById('searchJadwal');
        if(!keywordInput) return; // Mencegah error jika dipanggil saat DOM hilang
        
        const keyword = keywordInput.value.toLowerCase();
        const selectedSkema = document.getElementById('filterSkemaJadwal').value;
        const selectedTanggal = document.getElementById('filterTanggalJadwal').value;

        const filtered = allJadwalData.filter(item => {
            // PERBAIKAN: Tambahkan fallback (|| '') agar toLowerCase() tidak menyebabkan Fatal Error jika null
            const amanTuk = (item.tuk || '').toLowerCase();
            const amanAsesor = (item.asesor || '').toLowerCase();
            
            const matchKeyword = amanTuk.includes(keyword) || amanAsesor.includes(keyword);
            const matchSkema = selectedSkema === '' || item.skema === selectedSkema;
            const matchTanggal = selectedTanggal === '' || item.tanggal === selectedTanggal;
            return matchKeyword && matchSkema && matchTanggal;
        });
        
        renderJadwalTable(filtered);
    }

    // Attach Event Listeners
    document.getElementById('searchJadwal')?.addEventListener('input', applyFiltersJadwal);
    document.getElementById('filterSkemaJadwal')?.addEventListener('change', applyFiltersJadwal);
    document.getElementById('filterTanggalJadwal')?.addEventListener('change', applyFiltersJadwal);

    window.simpanAsesor = async function(event, index) {
        const btn = event.currentTarget;
        const inputField = document.getElementById(`inputAsesor_${index}`);
        const namaAsesor = inputField.value.trim();
        const jadwal = allJadwalData[index];

        jadwal.asesor = namaAsesor; 
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>'; 
        btn.disabled = true;

        try {
            if(!GAS_WEBAPP_URL || GAS_WEBAPP_URL.includes('GANTI_DENGAN')) throw new Error("URL Apps Script belum dikonfigurasi.");
            
            const payload = {
                tanggal: jadwal.tanggal, tuk: jadwal.tuk, skema: jadwal.skema, asesor: namaAsesor, jumlah_asesi: jadwal.asesiList.length
            };

            const response = await fetch(GAS_WEBAPP_URL, {
                method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const result = await response.json();
            
            if (result.status === 'success') showToastJadwal('Nama Asesor berhasil disimpan ke Sheets!', 'success');
            else throw new Error("Gagal menyimpan ke Sheet.");
        } catch (error) {
            console.error(error);
            showToastJadwal(error.message, 'error');
        } finally {
            btn.innerHTML = originalHtml; 
            btn.disabled = false;
        }
    };

    window.generateAbsensi = function(index) {
        const jadwal = allJadwalData[index];
        const asesor = document.getElementById(`inputAsesor_${index}`).value || '(..........................................)';
        
        const dateObj = new Date(jadwal.tanggal);
        const formatTanggal = dateObj.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        const printWindow = window.open('', '_blank');
        if(!printWindow) return showToastJadwal('Pop-up terblokir! Izinkan pop-up untuk mencetak.', 'error');

        let trRows = '';
        jadwal.asesiList.forEach((asesi, i) => {
            const ttdClass = i % 2 === 0 ? 'text-align:left; padding-left:10px;' : 'text-align:center; padding-left:40px;';
            trRows += '<tr>' +
                '<td style="text-align:center; padding:10px;">' + (i + 1) + '</td>' +
                '<td style="padding:10px; font-weight:bold;">' + asesi.nama + '</td>' +
                '<td style="padding:10px;">' + asesi.instansi + '</td>' +
                '<td style="padding:10px; width:200px; ' + ttdClass + '">' + (i + 1) + '. </td>' +
            '</tr>';
        });

        const htmlContent = '<!DOCTYPE html>\n' +
            '<' + 'html lang="id">\n' +
            '<' + 'head>\n' +
            '    <title>Daftar Hadir - ' + jadwal.skema + ' - ' + formatTanggal + '</title>\n' +
            '    <style>\n' +
            '        body { font-family: "Times New Roman", serif; margin: 40px; color: #000; }\n' +
            '        .header { text-align: center; border-bottom: 3px solid #000; padding-bottom: 20px; margin-bottom: 20px; }\n' +
            '        .header h2 { margin: 0; font-size: 22px; text-transform: uppercase; }\n' +
            '        .header h4 { margin: 5px 0 0 0; font-weight: normal; }\n' +
            '        .info-table { width: 100%; margin-bottom: 20px; font-size: 14px; }\n' +
            '        .info-table td { padding: 4px; }\n' +
            '        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }\n' +
            '        .data-table th, .data-table td { border: 1px solid #000; padding: 12px 8px; }\n' +
            '        .data-table th { background-color: #f2f2f2; text-align: center; }\n' +
            '        .footer { width: 100%; display: flex; justify-content: flex-end; margin-top: 50px; }\n' +
            '        .signature { text-align: center; width: 300px; }\n' +
            '        @media print { @page { margin: 15mm; } }\n' +
            '    </style>\n' +
            '</' + 'head>\n' +
            '<' + 'body>\n' +
            '    <div class="header">\n' +
            '        <h2>DAFTAR HADIR ASESI</h2>\n' +
            '        <h4>UJI KOMPETENSI LEMBAGA SERTIFIKASI PROFESI LINGKUNGAN HIDUP NASIONAL</h4>\n' +
            '    </div>\n' +
            '    <table class="info-table">\n' +
            '        <tr><td width="150"><strong>Hari, Tanggal</strong></td><td width="20">:</td><td>' + formatTanggal + '</td></tr>\n' +
            '        <tr><td><strong>Tempat Uji (TUK)</strong></td><td>:</td><td>' + jadwal.tuk + '</td></tr>\n' +
            '        <tr><td><strong>Skema Sertifikasi</strong></td><td>:</td><td>' + jadwal.skema + '</td></tr>\n' +
            '        <tr><td><strong>Nama Asesor</strong></td><td>:</td><td>' + asesor + '</td></tr>\n' +
            '    </table>\n' +
            '    <table class="data-table">\n' +
            '        <thead>\n' +
            '            <tr><th width="50">NO</th><th>NAMA LENGKAP</th><th>ASAL INSTANSI</th><th width="200">TANDA TANGAN</th></tr>\n' +
            '        </thead>\n' +
            '        <tbody>\n' +
            '            ' + trRows + '\n' +
            '        </tbody>\n' +
            '    </table>\n' +
            '    <div class="footer">\n' +
            '        <div class="signature">\n' +
            '            <p>' + jadwal.tuk + ', ' + formatTanggal + '</p>\n' +
            '            <p style="margin-bottom: 80px;">Asesor Kompetensi,</p>\n' +
            '            <p style="font-weight:bold; text-decoration:underline;">' + asesor + '</p>\n' +
            '        </div>\n' +
            '    </div>\n' +
            '</' + 'body>\n' +
            '</' + 'html>';

        printWindow.document.write(htmlContent);
        printWindow.document.close();
        printWindow.focus();

        setTimeout(() => { printWindow.print(); }, 500);
    };

    function showToastJadwal(msgText, type = 'success') {
        const toast = document.getElementById('toastJadwal');
        const icon = document.getElementById('toastIconJadwal');
        const msg = document.getElementById('toastMessageJadwal');
        if(!toast) return;
        
        if(type === 'success') {
            toast.className = 'fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 z-[60] flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border bg-white border-emerald-100 text-slate-700';
            icon.className = 'w-8 h-8 rounded-full flex items-center justify-center shrink-0 bg-emerald-100 text-emerald-600';
            icon.innerHTML = '<i class="fa-solid fa-check"></i>';
        } else {
            toast.className = 'fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 z-[60] flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border bg-white border-rose-100 text-slate-700';
            icon.className = 'w-8 h-8 rounded-full flex items-center justify-center shrink-0 bg-rose-100 text-rose-600';
            icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        }
        msg.textContent = msgText;
        setTimeout(() => { 
            toast.classList.replace('translate-y-0', 'translate-y-20'); 
            toast.classList.replace('opacity-100', 'opacity-0'); 
        }, 3000);
    }

    // Jalankan fetch pertama kali jika dipanggil langsung
    if(typeof fetchAndGroupJadwal === 'function') {
        fetchAndGroupJadwal();
    }
</script>
